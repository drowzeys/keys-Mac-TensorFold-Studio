<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TensorFold Studio</title>
<style>
:root { --bg:#06070c; --panel:rgba(19,22,33,.74); --panel2:rgba(30,34,50,.66); --ink:#090a11; --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.16);
  --text:#eceef7; --dim:#8f96ad; --accent:#67e3ff; --accent2:#8f7dff; --hot:#ff7a45; --ok:#3ddc97; --warn:#f5c15c; --bad:#ff6b85;
  --grad:linear-gradient(135deg,#67e3ff 0%,#8f7dff 100%); --grad-hot:linear-gradient(135deg,#ffb347 0%,#ff5f6d 100%);
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace; --ease:cubic-bezier(.2,.7,.2,1); }
* { box-sizing:border-box; }
html { color-scheme:dark; }
body { margin:0; color:var(--text); font:14px/1.5 -apple-system,"SF Pro Text","Inter","Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;
  background:radial-gradient(900px 520px at 12% -8%,rgba(103,227,255,.13),transparent 62%),radial-gradient(820px 560px at 96% 4%,rgba(143,125,255,.15),transparent 60%),var(--bg); background-attachment:fixed; }
body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px); background-size:44px 44px;
  mask-image:linear-gradient(to bottom,#000,transparent 70%); -webkit-mask-image:linear-gradient(to bottom,#000,transparent 70%); }
header, main { position:relative; z-index:1; }
header { display:flex; align-items:center; gap:16px; padding:11px 22px; border-bottom:1px solid var(--line); background:rgba(9,10,17,.72);
  backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%); position:sticky; top:0; z-index:5; }
header h1 { font-size:15px; font-weight:650; letter-spacing:.01em; margin:0 10px 0 0; } header h1 b { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:700; }
header .dot { width:22px; height:22px; border-radius:7px; background:var(--grad); box-shadow:0 0 18px rgba(103,227,255,.45); position:relative; flex:none; }
header .dot::after { content:""; position:absolute; inset:6px; border-radius:3px; background:var(--ink); }

  transition:background .18s var(--ease),border-color .18s var(--ease),transform .12s var(--ease),box-shadow .18s var(--ease); }
button:hover:not(:disabled) { border-color:var(--line2); background:rgba(255,255,255,.07); } button:active:not(:disabled) { transform:translateY(1px); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
nav button { border:0; background:transparent; color:var(--dim); padding:6px 14px; border-radius:8px; font-weight:550; }
nav button.on { background:rgba(255,255,255,.1); color:var(--text); box-shadow:inset 0 0 0 1px var(--line2); }
button.primary { background:var(--grad); border-color:transparent; color:#070810; font-weight:650; }
button.hot { background:var(--grad-hot); border-color:transparent; color:#190905; font-weight:700; padding:10px 20px; box-shadow:0 6px 24px -8px rgba(255,95,109,.7); }
button.primary:hover:not(:disabled), button.hot:hover:not(:disabled) { filter:brightness(1.08); }
button.primary:hover:not(:disabled) { background:var(--grad); } button.hot:hover:not(:disabled) { background:var(--grad-hot); }
button:disabled { opacity:.4; cursor:default; box-shadow:none; } button.small { padding:3px 9px; font-size:12px; border-radius:7px; }
main { display:grid; grid-template-columns:minmax(0,1fr) 370px; gap:18px; padding:18px 22px 40px; align-items:start; max-width:1560px; margin:0 auto; }
section.card, aside { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 60px -30px rgba(0,0,0,.8); }
aside { position:sticky; top:68px; max-height:calc(100vh - 86px); overflow:auto; padding:16px; }
h2 { font-size:17px; font-weight:650; letter-spacing:-.005em; margin:0 0 12px; }
h3 { font:600 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:18px 0 8px; }
label { display:block; color:var(--dim); font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; margin:14px 0 6px; }
input, select, textarea { width:100%; background:rgba(4,5,9,.6); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font:inherit;
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease); }
input:hover, select:hover, textarea:hover { border-color:var(--line2); }
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(103,227,255,.16); }
input[type=number] { font-family:var(--mono); } textarea { min-height:92px; resize:vertical; line-height:1.5; } input[type=checkbox] { width:auto; accent-color:var(--accent); }
::placeholder { color:#5b617a; }
.row { display:flex; gap:12px; align-items:end; flex-wrap:wrap; } .row > * { flex:1; min-width:120px; } .row > .fit { flex:0 0 auto; min-width:0; }
.steps { display:flex; gap:0; margin:-4px 0 18px; padding:4px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025); flex-wrap:wrap; }
.steps button { flex:1; font-size:12px; white-space:nowrap; border:0; background:transparent; color:var(--dim); border-radius:9px; padding:8px 10px; font-weight:550; }
.steps button.on { background:var(--grad); color:#070810; font-weight:700; box-shadow:0 4px 18px -6px rgba(103,227,255,.6); }
.note { color:var(--dim); font-size:12.5px; margin-top:8px; } .hide { display:none !important; }
/* choice groups: one decision, every option visible */
.choice { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
.choice button { text-align:left; padding:11px 13px; border-radius:12px; background:rgba(255,255,255,.028); display:flex; flex-direction:column; gap:2px; min-height:58px; justify-content:center; position:relative; }
.choice button b { font-weight:620; font-size:13.5px; } .choice button span { color:var(--dim); font-size:11.5px; line-height:1.35; }
.choice button.on { border-color:transparent; background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--grad) border-box; border:1px solid transparent; box-shadow:0 0 0 3px rgba(103,227,255,.09),0 10px 30px -18px rgba(103,227,255,.9); }
.choice button.on b { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.choice button:disabled { opacity:.35; }
.choice.tight { grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); } .choice.tight button { min-height:48px; padding:8px 11px; }
.group { border:1px solid var(--line); border-radius:14px; padding:4px 16px 16px; margin-top:14px; background:rgba(255,255,255,.018); }
.summary { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:rgba(4,5,9,.55); font:12.5px var(--mono); }
.summary .chip { padding:3px 10px; border-radius:999px; border:1px solid var(--line2); color:var(--text); white-space:nowrap; }
.summary .chip.k { border-color:transparent; background:var(--grad); color:#070810; font-weight:700; } .summary .eta { margin-left:auto; color:var(--accent); font-weight:600; }
.switch { display:flex; gap:12px; align-items:center; padding:11px 13px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.028); cursor:pointer; text-transform:none; letter-spacing:0; font-size:13px; color:var(--text); font-weight:500; margin:0; min-height:48px; }
.row .switch { height:46px; min-height:0; padding:0 13px; } input, select { height:46px; } textarea, input[type=checkbox], input[type=file], .clip input { height:auto; }
.switch input { appearance:none; height:22px; -webkit-appearance:none; width:38px; height:22px; border-radius:999px; background:#2a2f45; border:0; position:relative; padding:0; flex:none; cursor:pointer; transition:background .2s var(--ease); }
.switch input::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#cfd3e6; transition:transform .2s var(--ease); }
.switch input:checked { background:var(--accent2); background-image:var(--grad); } .switch input:checked::after { transform:translateX(16px); background:#070810; }
.switch input:disabled { opacity:.4; cursor:default; } .switch small { display:block; color:var(--dim); font-size:11.5px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.tile { background:var(--panel2); border:1px solid var(--line); border-radius:12px; overflow:hidden; transition:transform .18s var(--ease),border-color .18s var(--ease); }
.tile .cap > :first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .tile .cap button, .tile .cap a { white-space:nowrap; flex:none; }
.tile:hover { transform:translateY(-2px); border-color:var(--line2); } .tile.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset,0 12px 34px -18px rgba(103,227,255,.9); }
.tile img, .tile video { width:100%; display:block; background:#000; aspect-ratio:16/9; object-fit:contain; } .tile .cap { padding:8px 10px; font-size:12px; color:var(--dim); display:flex; gap:6px; align-items:center; justify-content:space-between; }
.pill { display:inline-block; padding:1px 9px; border-radius:20px; font:600 10.5px var(--mono); letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); }
.pill.done { color:var(--ok); border-color:rgba(61,220,151,.45); background:rgba(61,220,151,.08); } .pill.running { color:var(--warn); border-color:rgba(245,193,92,.45); background:rgba(245,193,92,.08); }
.pill.failed, .pill.cancelled { color:var(--bad); border-color:rgba(255,107,133,.45); background:rgba(255,107,133,.08); } .pill.queued { color:var(--dim); }
.job { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:9px; background:var(--panel2); }
.bar { height:6px; background:rgba(4,5,9,.8); border-radius:6px; overflow:hidden; margin:8px 0; } .bar i { display:block; height:100%; background:var(--grad); box-shadow:0 0 12px rgba(103,227,255,.7); border-radius:6px; transition:width .5s var(--ease); }
pre { background:rgba(4,5,9,.7); border:1px solid var(--line); border-radius:10px; padding:10px; white-space:pre-wrap; word-break:break-word; font:11px/1.5 var(--mono); max-height:220px; overflow:auto; }
.seg { border:1px solid var(--line); border-radius:13px; padding:12px 14px; margin-bottom:10px; background:var(--panel2); }
.seg.sel { border-color:var(--accent2); } .seg header, .seghead { all:unset; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.strip { display:flex; height:34px; border-radius:9px; overflow:hidden; border:1px solid var(--line); margin:8px 0; } .strip div { background:linear-gradient(180deg,rgba(143,125,255,.35),rgba(103,227,255,.18)); border-right:1px solid var(--ink); font-size:11px; padding:7px 8px; overflow:hidden; white-space:nowrap; }
video.main { width:100%; background:#000; border-radius:12px; max-height:52vh; border:1px solid var(--line); }
.tl { display:flex; gap:8px; overflow-x:auto; padding:10px; background:rgba(4,5,9,.6); border:1px solid var(--line); border-radius:12px; min-height:112px; }
.clip { flex:0 0 190px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:7px; font-size:12px; } .clip.on { border-color:var(--warn); }
.clip video { width:100%; aspect-ratio:16/9; background:#000; border-radius:6px; } .clip .row > * { min-width:0; } .clip input { padding:3px 6px; font-size:12px; }
a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); border-radius:10px; border:2px solid transparent; background-clip:padding-box; }
@media (max-width:1000px) { main { grid-template-columns:1fr; padding:14px 16px 30px; } aside { position:static; max-height:none; } header { flex-wrap:wrap; padding:10px 16px; } }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>

<body>
<header>
  <span class="dot"></span><h1><b>TensorFold</b> Studio</h1>
  <nav id="tabs"></nav>
  <small id="ver"></small>
</header>
<main>
  <div id="view"></div>
  <aside>
    <h2>Queue</h2>
    <div class="note">One job at a time, in order. Renders are written under <span id="home"></span>.</div>
    <div id="jobs" style="margin-top:10px"></div>
  </aside>
</main>
<script>
"use strict";
if (location.search.includes("shot")) document.write('<img src="/api/wait?ms=4000" style="display:none">');
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "html") n.innerHTML = v; else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v); }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(kid)); return n; };
const api = async (path, body, method) => { const r = await fetch(path, body === undefined ? { method: method || "GET" } :
    { method: method || "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({})); if (!r.ok) throw new Error(data.error || data.detail || r.statusText); return data; };
const file = path => "/files/" + path.split("/").map(encodeURIComponent).join("/");
const mmss = s => s == null ? "" : s >= 3600 ? Math.floor(s / 3600) + " h " + Math.round(s % 3600 / 60) + " min" : (s >= 60 ? Math.floor(s / 60) + " min " : "") + Math.round(s % 60) + " s";
const put = (node, ...kids) => node.append(...kids.flat().filter(k => k != null && k !== false));
const toast = text => { const n = el("div", { style: "position:fixed;bottom:18px;left:18px;background:#2b3050;border:1px solid var(--accent);padding:9px 14px;border-radius:8px;z-index:9" }, text); document.put(body, n); setTimeout(() => n.remove(), 3500); };

let S = null, jobs = [], tab = "Create", project = null;
const C = { step: 0, mode: "scout", preset: "draft", quality: "standard", seconds: 5, seed: 1, scene: "", action: "", camera: "",
  dialogue: [], soundscape: "", music: "N/A", imagePrompt: "", image: null, scoutJob: null, prompt: "", job: null, count: 4, imageSize: "1344x768", imageJob: null, beats: "" };
const field = (labelText, node) => el("div", {}, el("label", {}, labelText), node);
const bind = (obj, key, node, after) => { const isBox = node.type === "checkbox"; if (isBox) node.checked = !!obj[key]; else node.value = obj[key] ?? "";
  node.addEventListener("input", () => { obj[key] = isBox ? node.checked : (node.type === "number" ? Number(node.value) : node.value); if (after) after(); }); return node; };
const select = (obj, key, options, after) => { const n = el("select", {}, Object.entries(options).map(([v, t]) => el("option", { value: v }, t))); return bind(obj, key, n, after); };
const media = (path, attrs = {}) => /\.(mp4|mov)$/i.test(path) ? el("video", { src: file(path), controls: true, preload: "metadata", ...attrs }) : el("img", { src: file(path), loading: "lazy", ...attrs });

const IMAGE_SIZES = { "1344x768": "1344x768 (16:9)", "1664x928": "1664x928 (16:9, larger)", "1024x1024": "1024x1024 (square)", "768x1344": "768x1344 (9:16)" };
Object.assign(C, { goes: "video", start: "text", engine: "fasth3", passes: "8", h3quality: "standard", res: "480p", up: false });
const ENGINES = { fasth3: "FastH3 (FastVideo, sparse attention): fastest", h3: "MiniMax H3 (Turbo adapter or full 20 steps)" };
const RESOLUTIONS = { "480p": "480p · 864x480", "720p": "720p · 1280x720", draft: "Draft · 1344x768, generated at 672x384 with the 2x decoder",
  "2k": "2K · 2048x1152, generated at 1024x576 with the 2x decoder", native: "Native · 1344x768" };
const UPSCALED = { "480p": ["p960", "1728x960"], "720p": ["qhd", "2560x1440 (2K)"] };
const noFrame = () => C.mode === "t2v";
const isLong = () => Number(C.seconds) > 15;
// the explicit controls decide the mode, the quality and the output preset the server understands
function sync() {
  C.mode = C.goes === "image" ? "image" : { text: "t2v", scout: "scout", own: "i2v" }[C.start];
  C.quality = C.engine === "fasth3" ? "fh" + C.passes : C.h3quality;
  if (!UPSCALED[C.res]) C.up = false;
  C.preset = UPSCALED[C.res] ? (C.up ? UPSCALED[C.res][0] : { "480p": "small", "720p": "p720" }[C.res]) : C.res;
}
function changed() { sync(); C.prompt = ""; render(); }
// one decision shown as cards: options are value -> [title, detail]
const choice = (obj, key, options, after, tight) => el("div", { class: "choice" + (tight ? " tight" : ""), role: "radiogroup" }, Object.entries(options).map(([v, [title, sub]]) =>
  el("button", { type: "button", role: "radio", "aria-checked": String(obj[key]) === v ? "true" : "false", class: String(obj[key]) === v ? "on" : "", onclick: () => { obj[key] = v; if (after) after(); } }, el("b", {}, title), sub ? el("span", {}, sub) : null)));
const PASSES = { 4: ["4 passes", "fastest, a little softer"], 8: ["8 passes", "what FastH3 was trained for"], 20: ["20 passes", "slowest, most texture"] };
const H3Q = { standard: ["Turbo 5 + base sound", "the standard"], fast: ["Turbo 3", "quickest, adapter sound"], high: ["20 steps, fast recipe", "higher quality"], full: ["20 steps, plain", "slowest"] };
const RES = { "480p": ["480p", "864 × 480"], "720p": ["720p", "1280 × 720"], draft: ["Draft", "1344 × 768 via 2x"], "2k": ["2K", "2048 × 1152 via 2x"], native: ["Native", "1344 × 768"] };
function videoControls(after) {
  const two = bind(C, "up", el("input", { type: "checkbox", disabled: !UPSCALED[C.res] }), changed);
  return el("div", { class: "group" },
    el("label", {}, "Video engine"), choice(C, "engine", { fasth3: ["FastH3", "FastVideo's distilled H3 on the sparse tile kernel: fastest"], h3: ["MiniMax H3", "Turbo adapter with base-model sound, or the full 20 steps"] }, changed),
    el("label", {}, C.engine === "fasth3" ? "Passes" : "Quality"), C.engine === "fasth3" ? choice(C, "passes", PASSES, changed, true) : choice(C, "h3quality", H3Q, changed, true),
    el("label", {}, "Resolution"), choice(C, "res", RES, changed, true),
    el("div", { class: "row" },
      el("div", {}, el("label", {}, "Upscale"), el("label", { class: "switch" }, two, el("span", {}, "2x upscale", el("small", {}, UPSCALED[C.res] ? "2x decoder → " + UPSCALED[C.res][1] + ", about 10 s more" : "already part of this output")))),
      el("div", { class: "fit", style: "width:250px" }, el("label", {}, "Length"), select(C, "seconds", { ...Object.fromEntries(Object.keys(S.durations).map(k => [k, k + " s · " + S.durations[k] + " frames"])),
        ...Object.fromEntries(Object.entries(S.long).map(([k, v]) => [k, v + " · " + Math.ceil(k / 15) + " clips chained"])) }, after)),
      el("div", { class: "fit", style: "width:120px" }, el("label", {}, "Seed"), bind(C, "seed", el("input", { type: "number", min: 0 })))));
}
function summary(est) {
  const size = S.presets[C.preset].size, engine = C.engine === "fasth3" ? "FastH3 · " + C.passes + " passes" : "MiniMax H3 · " + H3Q[C.h3quality][0];
  return el("div", { class: "summary" }, el("span", { class: "chip k" }, { t2v: "TEXT → VIDEO", scout: "QWEN IMAGE → VIDEO", i2v: "IMAGE → VIDEO" }[C.mode]),
    el("span", { class: "chip" }, engine), el("span", { class: "chip" }, size[0] + " × " + size[1]), el("span", { class: "chip" }, isLong() ? S.long[C.seconds] + " · " + Math.ceil(C.seconds / 15) + " × 15 s" : C.seconds + " s · " + S.durations[C.seconds] + " f"), est);
}
function settingsRow(obj, after, keep = {}) {
  const presets = Object.entries(S.presets).filter(([k]) => !keep.presets || keep.presets(k));
  const qualities = Object.fromEntries(Object.entries(S.qualities).filter(([k]) => !keep.qualities || keep.qualities(k)));
  return el("div", { class: "row" },
    field("Clip length", select(obj, "seconds", Object.fromEntries(Object.keys(S.durations).map(s => [s, s + " s (" + S.durations[s] + " frames)"])), after)),
    field("Output", select(obj, "preset", Object.fromEntries(presets.map(([k, v]) => [k, v.label])), after)),
    field("Quality", select(obj, "quality", qualities, after)),
    el("div", { class: "fit", style: "width:110px" }, el("label", {}, "Seed"), bind(obj, "seed", el("input", { type: "number", min: 0 }))));
}
async function showEstimate(obj, node) { try { const r = await api("/api/estimate", { preset: obj.preset, quality: obj.quality, seconds: Number(obj.seconds) });
  node.textContent = r.seconds ? "≈ " + mmss(r.seconds) + " on an M5 Ultra" : ""; } catch { node.textContent = ""; } }

/* ---------- Create ---------- */
const STEPS = ["1. Intent / Mode", "2. First frame", "3. Words / Sound", "4. Review prompt", "5. Render"];
function viewCreate() {
  const body = el("div");
